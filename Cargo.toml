[package]
name = "starlab-desktop"
version = "0.1.0"
edition = "2024"
description = "Starlab — native desktop MPC wallet (Iced GUI over the starlab-mpc engine)"
# Proprietary product — not published to crates.io.
publish = false

[dependencies]
# Iced UI (Elm architecture, MIT-licensed). The default backend (wgpu) +
# tiny-skia fallback covers X11, Wayland, macOS and Windows. `tokio` feature
# wires Iced's executor to the same Tokio runtime the core managers run on.
iced = { version = "0.14.0", features = ["tokio", "svg", "image-without-codecs"] }

# Business-logic backend: the FROST engine + core managers
# (WalletManager, SessionManager, DkgManager, OfflineManager,
# ConnectionManager, SigningManager, CoreState) + HeadlessRunner — consumed
# from the engine repo as a git dependency. Pin to a tag/rev for releases.
starlab-client = { git = "https://github.com/stars-labs/starlab-mpc", branch = "main" }

# The account model (BIP-44 paths + public-only per-account address
# derivation) — single source of truth shared by every client. Used directly
# by the view layer so switching accounts is a pure local re-derivation.
starlab-core = { git = "https://github.com/stars-labs/starlab-mpc", branch = "main" }

# Decode the packaged Sui PNG only; avoid unrelated image codec dependencies.
image = { version = "0.25.10", default-features = false, features = ["png"] }

hex = "0.4.3"
uuid = { version = "1.29.3", features = ["v4"] }

# Directly construct the shared headless runner so the desktop shell can update
# the signal-server URL at runtime before reconnecting.
frost-ed25519 = { version = "3.0.0", features = ["serde", "serialization"] }
frost-secp256k1-tr = { version = "3.0.0", features = ["serde", "serialization"] }

# Async runtime for the core managers + the mpsc UICallback bridge +
# tokio::task::spawn_blocking for rfd dialogs.
tokio = { version = "1.54.1", features = ["full"] }


# Error handling in the CoreAdapter wrappers.
anyhow = "1.0.105"

# Logging.
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Native file-open / save dialogs for keystore import/export and the SD-card
# folder picker.
rfd = "0.18.0"

# Required by starlab-client::core::UICallback (`#[async_trait]`) and for timestamp
# formatting in log-event payloads pushed to the UI.
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }

[[bin]]
name = "starlab-desktop"
path = "src/main.rs"

[dev-dependencies]
# Headless UI tests: simulate clicks and render snapshots without a window.
iced_test = "0.14.0"
serde_json = "1.0.154"
# Sign test messages with a known key to check the ecrecover verification.
k256 = { version = "0.14.0", features = ["ecdsa"] }
# In-process signal server for the end-to-end create → sign test.
starlab-signal-server = { git = "https://github.com/stars-labs/starlab-mpc", branch = "main" }

# The engine's threshold ECDSA (cggmp24) is big-integer heavy (Paillier + ZK
# proofs): unoptimized, a debug build's wallet setup and the e2e test take
# 10-50x longer. Optimize just that arithmetic stack in dev/test builds (same
# list as the engine's workspace).
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.num-integer]
opt-level = 3
[profile.dev.package.fast-paillier]
opt-level = 3
[profile.dev.package.paillier-zk]
opt-level = 3
[profile.dev.package.cggmp24]
opt-level = 3
[profile.dev.package.cggmp24-keygen]
opt-level = 3
[profile.dev.package.generic-ec]
opt-level = 3
[profile.dev.package.generic-ec-curves]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
