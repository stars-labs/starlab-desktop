name: Desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Formatting
        run: nix develop --command cargo fmt --check
      - name: Tests
        run: nix develop --command cargo test --locked
      - name: Strict Clippy
        run: nix develop --command cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: nix develop --command cargo build --locked --release
